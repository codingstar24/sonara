name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web Application & Electron
        run: |
          npm run build
          npm run build:electron

      - name: Package Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Generate Release Notes & Checksums
        shell: pwsh
        run: |
          $exe = Get-Item "dist-release/Sonara Setup *.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            $exe = Get-Item "release/Sonara Setup *.exe"
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "Release Asset: $($exe.Name)" | Out-File -FilePath release_notes.md
          "SHA-256 Checksum: `$hash`" | Out-File -FilePath release_notes.md -Append

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-release/Sonara Setup *.exe
            release/Sonara Setup *.exe
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
